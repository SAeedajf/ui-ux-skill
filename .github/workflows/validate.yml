name: Validate repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned packaging validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate repository and evaluation ledgers
        run: python3 scripts/validate_repo.py
      - name: Validate plugin marketplace
        run: python3 scripts/validate_marketplace.py
      - name: Run deterministic regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated plugin package
        run: |
          python3 scripts/build-plugin.py --check
          python3 scripts/validate-plugin.py
      - name: Build deterministic plugin archive
        run: python3 scripts/build-plugin.py --check --archive
      - name: Upload plugin ZIP and provenance
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-pro-0.1.0-phase-04-rc
          path: |
            dist/ui-ux-pro-0.1.0.zip
            dist/ui-ux-pro-0.1.0.manifest.json
          if-no-files-found: error
      - name: Finalize and validate Phase 04 report
        run: >-
          python3 scripts/validate_phase04_report.py
          --finalize-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --archive dist/ui-ux-pro-0.1.0.zip
      - name: Validate Phase 05 operational report
        run: python3 scripts/validate_phase05_report.py
      - name: Finalize Phase 05 report for this CI run
        env:
          PHASE05_OUTPUT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/validate_phase05_report.py
          --finalize-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --output-commit "$PHASE05_OUTPUT_COMMIT"
          --output dist/phase-05/phase-05.json
      - name: Validate Phase 05-B runtime acceptance report
        run: python3 scripts/validate_phase05b_report.py
      - name: Finalize Phase 05-B report for this CI run
        env:
          PHASE05B_OUTPUT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/validate_phase05b_report.py
          --finalize-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          --output-commit "$PHASE05B_OUTPUT_COMMIT"
          --output dist/phase-05b/phase-05b.json
      - name: Upload Phase 04 machine report
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-pro-phase-04-report
          path: |
            docs/plugin/reports/phase-04.json
            schemas/phase-04-report.schema.json
            docs/plugin/reports/phase-04-evidence.md
            docs/plugin/security-and-provenance-review.md
          if-no-files-found: error
      - name: Upload Phase 05 runtime report artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-pro-phase-05-report
          path: |
            dist/phase-05/phase-05.json
            docs/plugin/reports/phase-05.md
            docs/plugin/reports/phase-05-evidence.md
            schemas/phase-05-report.schema.json
            docs/plugin/source-rights-resolution.md
            docs/plugin/owner-runtime-acceptance.md
          if-no-files-found: error
      - name: Upload Phase 05-B runtime acceptance report
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-pro-phase-05b-report
          path: |
            dist/phase-05b/phase-05b.json
            docs/plugin/reports/phase-05b.md
            docs/plugin/reports/phase-05b-evidence.md
            docs/plugin/reports/evidence/phase-05b-positive-blocked.jsonl
            docs/plugin/reports/evidence/phase-05b-fixture-baseline.txt
            schemas/phase-05b-report.schema.json
          if-no-files-found: error
      - name: Generate evaluation status report
        run: python3 scripts/eval_harness.py report
